worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 32k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = /presentacion {
            return 301 /presentacion/;
        }

        location ^~ /presentacion/ {
            alias /usr/share/academy-site/;
            index index.html;
        }

        location = /kali {
            return 301 /kali/;
        }

        location = /mailpit {
            return 301 /mailpit/;
        }

        location = /kali/websockify {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
            proxy_buffering off;
            proxy_pass http://kali:6080/websockify;
        }

        location ^~ /kali/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /kali;
            proxy_pass http://kali:6080/;
        }

        location ^~ /mailpit/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /mailpit;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /mailpit/;
            proxy_pass http://mailpit:8025/mailpit/;
        }

        location ^~ /VulnerableApp/ {
            # La app intencionalmente vulnerable nunca comparte el origen
            # de las sesiones del portal: úsala desde Firefox en Kali.
            return 303 /kali/vnc.html?autoconnect=1&resize=scale&path=websockify;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://academy:8000;
        }
    }
}
