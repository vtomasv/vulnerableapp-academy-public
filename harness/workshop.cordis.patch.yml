# La UI necesita los registries commands/subagent y el provider shell para
# sus contratos internos. No son herramientas del agente: los consumidores
# genéricos siguen deshabilitados y el preset vulnerableapp solo aporta skills.
# La guarda monotónica cierra cualquier herramienta adicional de otro preset.
- insert:
    - id: academy-workshop-plugin
      name: /opt/academy-harness/workshop-plugin.mjs
