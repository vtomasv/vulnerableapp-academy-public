# Taller VulnerableApp Academy: overlay cerrado para el laboratorio Docker local.
# Este archivo se aplica sobre dsh-base + dsh-web. Las tools adicionales no
# reciben hosts/rutas: el plugin delega solamente en el helper allowlisted.
- id: agent-default-model
  config:
    provider: ollama-local
    model: huihui_ai/qwen3-abliterated:1.7b-v2-q4_K_M

- id: llm-pi-ai
  config:
    providers:
      ollama-local:
        displayName: Ollama local (taller)
        apiKeyEnv: OLLAMA_DUMMY_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:11435/v1
        defaultContextWindow: 8192
        defaultMaxTokens: 256
        defaultInput: [text]
        reasoning: off
        retryPolicy:
          mode: normal
          maxRetries: 0
          backoff:
            initialDelayMs: 1
            maxDelayMs: 1
            jitterRatio: 0
        models:
          - id: huihui_ai/qwen3-abliterated:1.7b-v2-q4_K_M
            name: Qwen local (Ollama)
            contextWindow: 8192
            maxTokens: 256
            input: [text]
            reasoningEfforts: false

- id: system-prompt
  config:
    persona: >-
      Eres el tutor del taller VulnerableApp Academy. Responde en español,
      explica cada paso con precisión y trabaja únicamente dentro del
      laboratorio Docker autorizado. No ejecutes ni describas acciones contra
      hosts externos. No expongas razonamiento interno: entrega conclusiones,
      supuestos y evidencia verificable. no_think

- id: skill-filesystem
  config:
    providerName: academy-harness
    includeDefaultRoots: false
    customSkillDirs:
      - /opt/academy-harness/skills
    watch: false
    watchFollowSymlinks: false

- id: tools
  config:
    # The workshop exposes only native calls; no Code Mode transport is loaded.
    mode: native

- id: agent-presets
  config:
    # Every new Web agent joins the exact docente composition. Its scoped
    # skill loader sees the global workshop skill catalog and the plugin's
    # monotonic guard still closes all non-lab tool calls.
    default: vulnerableapp
    includeUserRoot: false
    roots:
      - path: /opt/academy-harness/presets
        trust: system

# No se permite el modo Code, ejecución de shell/filesystem, delegación,
# workflow, búsqueda web, telemetría ni proveedores remotos.
