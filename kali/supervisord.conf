[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp -ac
user=kali
environment=HOME="/home/kali",DISPLAY=":99"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ollama-adapter]
command=/usr/bin/python3 /opt/academy-harness/ollama_proxy.py
user=kali
environment=HOME="/home/kali",USER="kali",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=55
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pentest-harness]
command=/bin/sh /opt/academy-harness/start.sh
directory=/home/kali
user=kali
environment=HOME="/home/kali",USER="kali",DSH_HOME="/home/kali/.local/share/pentest-harness",DSH_TELEMETRY_DISABLED="1",OLLAMA_DUMMY_API_KEY="ollama-local-only"
autostart=true
autorestart=true
priority=60
startsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xfce]
command=/usr/bin/dbus-run-session -- /usr/local/bin/start-desktop.sh
user=kali
environment=HOME="/home/kali",DISPLAY=":99",USER="kali"
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -localhost -listen 127.0.0.1 -forever -shared -nopw -rfbport 5900 -noxdamage
user=kali
environment=HOME="/home/kali",DISPLAY=":99"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900
user=kali
environment=HOME="/home/kali"
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:runner]
command=/opt/playwright-venv/bin/python /usr/local/bin/runner.py
user=runner
environment=HOME="/home/runner",RUNNER_SECRET_FILE="/run/academy-secrets/harness.key",RUNNER_BIND="0.0.0.0:9001"
autostart=true
autorestart=true
priority=50
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
